batch-size: 8
check-mode: letter+word
debug: false
defaultexclude: ^(\.git|.*\.zip|.*\.gz|.*\.xz|.*\.bz2|.*\.zstd|.*\.7z|.*\.dll|.*\.iso|.*\.bin|.*\.tar|.*\.exe)$
exclude: ""
fptn: .*
group-index-a: []
group-index-b: []
path-exclude:
    - ansible\/artifacts.*
    - ansible-deploy-common\/.*
    - node_modules
    - \.terraform
    - \.env
    - (.*\.auto\.tfvars|.*tfstate.*)
    - \.aig.*
profile: cred-detect-profile.json
regexp: []
save-config: cred-detect-config.yaml
skipbinary: true
words-file: ""
words-list-url: https://github.com/dwyl/english-words/blob/master/words.txt
